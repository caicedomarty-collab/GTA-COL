<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colombia GTA - Vice City Style</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="loading">
        <div class="loader">
            <h1>COLOMBIA GTA</h1>
            <p>Cargando ciudad...</p>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

    <div id="menu" style="display:none">
        <div class="menu-content">
            <h1>COLOMBIA GTA</h1>
            <h2>Vice City Style</h2>
            <div class="menu-buttons">
                <button id="btn-play">Nueva Partida</button>
                <button id="btn-missions">Misiones</button>
                <button id="btn-controls">Controles</button>
                <button id="btn-about">Acerca de</button>
            </div>
        </div>
    </div>

    <div id="hud" style="display:none">
        <!-- HUD superior derecho estilo GTA -->
        <div id="hud-top-right">
            <!-- Estrellas de búsqueda -->
            <div id="wanted-stars">
                <span class="wanted-star">★</span>
                <span class="wanted-star">★</span>
                <span class="wanted-star">★</span>
                <span class="wanted-star">★</span>
                <span class="wanted-star">★</span>
            </div>
            
            <!-- Salud y armadura -->
            <div id="health-armor">
                <div class="hud-icon-group">
                    <span class="hud-icon">❤️</span>
                    <div id="health-bar-hud">
                        <div id="health-fill-hud"></div>
                    </div>
                </div>
                <div class="hud-icon-group">
                    <span class="hud-icon">🛡️</span>
                    <div id="armor-bar-hud">
                        <div id="armor-fill-hud"></div>
                    </div>
                </div>
            </div>
            
            <!-- Dinero -->
            <div id="money-hud">$0</div>
        </div>

        <!-- Misión actual -->
        <div id="current-mission-hud">
            <div id="mission-title-hud">Sin misión</div>
            <div id="mission-desc-hud">Presiona M para misiones</div>
        </div>

        <!-- Minimapa circular -->
        <div id="minimap-container">
            <canvas id="minimap-canvas" width="160" height="160"></canvas>
            <div id="minimap-player"></div>
        </div>

        <!-- Controles -->
        <div id="controls-hint">
            WASD: Mover<br>
            Espacio: Saltar<br>
            E: Vehículo<br>
            M: Misiones
        </div>
    </div>

    <div id="mission-panel">
        <div class="panel-content">
            <h2>Lista de Misiones</h2>
            <div id="missions-list"></div>
            <button id="btn-close-missions">Cerrar</button>
        </div>
    </div>

    <div id="game-container"></div>

    <script src="game.js"></script>
    <script src="city.js"></script>
    <script src="player.js"></script>
    <script src="missions.js"></script>
    
    <script>
        document.getElementById('btn-play').onclick = startGame;
        document.getElementById('btn-missions').onclick = function() {
            alert('Presiona M durante el juego para ver misiones');
        };
        document.getElementById('btn-controls').onclick = function() {
            alert('Controles:\n\nWASD - Mover\nEspacio - Saltar\nE - Vehículo\nM - Misiones\n\nCámara estilo GTA en tercera persona');
        };
        document.getElementById('btn-about').onclick = function() {
            alert('Colombia GTA - Vice City Style\n\nJuego 3D estilo GTA Vice City\nambientado en Colombia.\n\n100 misiones | Mundo abierto | Vehículos');
        };
        document.getElementById('btn-close-missions').onclick = function() {
            document.getElementById('mission-panel').style.display = 'none';
        };
    </script>
</body>
</html>
